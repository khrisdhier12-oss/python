<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 Python IDE V7.1</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0d1117;
    color: #e6edf3;
    font-family: Consolas, "Courier New", monospace;
}

body {
    display: flex;
    flex-direction: column;
}

/* =========================
   TOPBAR
========================= */

.topbar {
    height: 54px;
    min-height: 54px;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 12px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
}

.logo {
    font-size: 17px;
    font-weight: bold;
    margin-right: 12px;
    white-space: nowrap;
}

button {
    border: 1px solid #30363d;
    background: #21262d;
    color: #e6edf3;
    padding: 7px 11px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
}

button:hover {
    background: #30363d;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.run-btn {
    background: #238636;
    border-color: #2ea043;
}

.run-btn:hover {
    background: #2ea043;
}

.stop-btn {
    background: #da3633;
    border-color: #f85149;
}

.stop-btn:hover {
    background: #f85149;
}

.delete-btn {
    color: #ff7b72;
}

.status {
    margin-left: auto;
    color: #8b949e;
    font-size: 12px;
    white-space: nowrap;
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;
    min-height: 0;
    display: flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 225px;
    min-width: 225px;
    display: flex;
    flex-direction: column;
    background: #0d1117;
    border-right: 1px solid #30363d;
}

.sidebar-title {
    height: 45px;
    min-height: 45px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    font-weight: bold;
    border-bottom: 1px solid #21262d;
}

.file-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
}

.file {
    padding: 9px 10px;
    margin-bottom: 2px;
    border-radius: 6px;
    cursor: pointer;
    color: #c9d1d9;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.file:hover {
    background: #161b22;
}

.file.active {
    background: #1f6feb33;
    color: #58a6ff;
}

/* =========================
   WORKSPACE
========================= */

.workspace {
    flex: 1;
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
}

/* =========================
   EDITOR
========================= */

.editor-container {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    background: #0d1117;
}

.line-numbers {
    width: 55px;
    min-width: 55px;
    padding: 15px 12px 15px 0;
    text-align: right;
    color: #484f58;
    font-size: 14px;
    line-height: 22px;
    overflow: hidden;
    user-select: none;
}

.editor {
    flex: 1;
    min-width: 0;
    min-height: 0;
    position: relative;
    overflow: hidden;
}

#code,
#highlight {
    position: absolute;
    inset: 0;
    margin: 0;
    padding: 15px 18px;
    border: 0;
    outline: 0;
    font-family: Consolas, "Courier New", monospace;
    font-size: 14px;
    line-height: 22px;
    white-space: pre;
    tab-size: 4;
    overflow: auto;
}

#highlight {
    z-index: 1;
    color: #e6edf3;
    pointer-events: none;
}

#code {
    z-index: 2;
    resize: none;
    background: transparent;
    color: transparent;
    caret-color: white;
}

#code::selection {
    background: #264f78;
}

/* =========================
   SYNTAX
========================= */

.syntax-keyword {
    color: #ff7b72;
}

.syntax-string {
    color: #a5d6ff;
}

.syntax-number {
    color: #79c0ff;
}

.syntax-comment {
    color: #8b949e;
}

.syntax-builtin {
    color: #ffa657;
}

.syntax-boolean {
    color: #79c0ff;
}

/* =========================
   AUTOCOMPLETE
========================= */

.autocomplete {
    position: absolute;
    z-index: 30;
    display: none;
    min-width: 210px;
    max-width: 320px;
    max-height: 250px;
    overflow-y: auto;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 6px;
    box-shadow: 0 8px 25px rgba(0,0,0,.55);
}

.suggestion {
    padding: 8px 10px;
    cursor: pointer;
    font-size: 13px;
}

.suggestion:hover,
.suggestion.selected {
    background: #1f6feb;
    color: white;
}

.suggestion-type {
    float: right;
    color: #8b949e;
    font-size: 10px;
}

/* =========================
   ERROR
========================= */

.error-panel {
    position: absolute;
    z-index: 20;
    left: 20px;
    right: 20px;
    bottom: 10px;
    display: none;
    padding: 9px 12px;
    background: #3d1618;
    border: 1px solid #f85149;
    border-radius: 6px;
    color: #ff7b72;
    font-size: 13px;
}

/* =========================
   CONSOLE
========================= */

.bottom {
    height: 230px;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    background: #010409;
    border-top: 1px solid #30363d;
}

.bottom-header {
    height: 38px;
    min-height: 38px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    font-size: 13px;
}

.console {
    flex: 1;
    overflow: auto;
    padding: 12px;
    white-space: pre-wrap;
    font-size: 13px;
    line-height: 20px;
}

.console-info {
    color: #58a6ff;
}

.console-success {
    color: #3fb950;
}

.console-error {
    color: #ff7b72;
}

/* =========================
   LOADING
========================= */

.loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
    background: #0d1117;
    padding: 25px;
}

.loading-title {
    font-size: 23px;
    font-weight: bold;
}

.loading-text {
    color: #8b949e;
    text-align: center;
    max-width: 700px;
}

.progress {
    width: 320px;
    max-width: 90%;
    height: 8px;
    overflow: hidden;
    background: #21262d;
    border-radius: 20px;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #238636;
    transition: width .3s;
}

.loading-error {
    display: none;
    max-width: 700px;
    padding: 12px;
    border: 1px solid #f85149;
    border-radius: 7px;
    background: #3d1618;
    color: #ff7b72;
    white-space: pre-wrap;
    font-size: 13px;
}

.loading-buttons {
    display: none;
    gap: 8px;
}

.loading-buttons button {
    background: #238636;
    border-color: #2ea043;
}

/* =========================
   FULLSCREEN
========================= */

.fullscreen .sidebar {
    display: none;
}

.fullscreen .bottom {
    height: 180px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 800px) {

    .sidebar {
        width: 160px;
        min-width: 160px;
    }

    .logo {
        display: none;
    }

    .topbar button {
        padding: 6px 8px;
    }

    .status {
        display: none;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOADING
========================= -->

<div class="loading-overlay" id="loadingOverlay">

    <div class="loading-title">
        🐍 Python IDE V7.1
    </div>

    <div class="loading-text" id="loadingText">
        Préparation de Python...
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="loading-error" id="loadingError"></div>

    <div class="loading-buttons" id="loadingButtons">
        <button onclick="restartPython()">
            🔄 Réessayer
        </button>
    </div>

</div>


<!-- =========================
     TOPBAR
========================= -->

<div class="topbar">

    <div class="logo">
        🐍 Python IDE V7.1
    </div>

    <button onclick="newFile()">
        📄 Nouveau
    </button>

    <button onclick="saveFile()">
        💾 Sauvegarder
    </button>

    <button class="delete-btn" onclick="deleteCurrentFile()">
        🗑️ Supprimer
    </button>

    <button
        class="run-btn"
        id="runButton"
        onclick="runCode()"
        disabled
    >
        ▶ Exécuter
    </button>

    <button
        class="stop-btn"
        id="stopButton"
        onclick="stopCode()"
        disabled
    >
        ⏹ Arrêter
    </button>

    <button onclick="clearConsole()">
        🧹 Console
    </button>

    <button onclick="restartPython()">
        🔄 Python
    </button>

    <button onclick="toggleFullscreen()">
        ⛶ Plein écran
    </button>

    <div class="status" id="status">
        Chargement...
    </div>

</div>


<!-- =========================
     MAIN
========================= -->

<div class="main">

    <div class="sidebar">

        <div class="sidebar-title">
            📁 Fichiers
        </div>

        <div class="file-list" id="fileList"></div>

    </div>


    <div class="workspace">

        <div class="editor-container">

            <div class="line-numbers" id="lineNumbers">
                1
            </div>

            <div class="editor">

                <pre id="highlight"></pre>

                <textarea
                    id="code"
                    spellcheck="false"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                ></textarea>

                <div
                    class="autocomplete"
                    id="autocomplete"
                ></div>

                <div
                    class="error-panel"
                    id="errorPanel"
                ></div>

            </div>

        </div>


        <div class="bottom">

            <div class="bottom-header">
                🖥 Console
            </div>

            <div class="console" id="console"></div>

        </div>

    </div>

</div>


<script>

/* =====================================================
   CONFIGURATION
===================================================== */

const PYODIDE_VERSION = "0.29.3";

const PYODIDE_BASE =
    "https://cdn.jsdelivr.net/pyodide/" +
    PYODIDE_VERSION +
    "/full/";

const PYODIDE_SCRIPT =
    PYODIDE_BASE +
    "pyodide.js";

const FILES_KEY =
    "python_ide_v71_files";


/* =====================================================
   VARIABLES
===================================================== */

let worker = null;

let workerReady = false;

let running = false;

let currentFile = "main.py";

let runTimer = null;

let runId = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const code =
    document.getElementById("code");

const highlight =
    document.getElementById("highlight");

const lineNumbers =
    document.getElementById("lineNumbers");

const consoleElement =
    document.getElementById("console");

const errorPanel =
    document.getElementById("errorPanel");

const autocomplete =
    document.getElementById("autocomplete");

const statusElement =
    document.getElementById("status");

const runButton =
    document.getElementById("runButton");

const stopButton =
    document.getElementById("stopButton");

const loadingOverlay =
    document.getElementById("loadingOverlay");

const loadingText =
    document.getElementById("loadingText");

const progressBar =
    document.getElementById("progressBar");

const loadingError =
    document.getElementById("loadingError");

const loadingButtons =
    document.getElementById("loadingButtons");


/* =====================================================
   CONSOLE
===================================================== */

function consoleWrite(text, className = "") {

    const span =
        document.createElement("span");

    if (className) {
        span.className = className;
    }

    span.textContent = text;

    consoleElement.appendChild(span);

    consoleElement.scrollTop =
        consoleElement.scrollHeight;
}


function clearConsole() {
    consoleElement.innerHTML = "";
}


/* =====================================================
   WORKER
===================================================== */

function createWorker() {

    const workerCode = `

        let pyodide = null;

        const BASE =
            "${PYODIDE_BASE}";

        const SCRIPT =
            "${PYODIDE_SCRIPT}";


        function send(type, data = {}) {

            self.postMessage({
                type,
                ...data
            });

        }


        send("loading", {
            text: "Téléchargement de Pyodide...",
            progress: 10
        });


        try {

            importScripts(SCRIPT);

        } catch(error) {

            send("fatal", {
                error:
                    "Impossible de charger Pyodide.\\\\n\\\\n" +
                    String(error)
            });

            throw error;
        }


        async function start() {

            try {

                send("loading", {
                    text: "Pyodide téléchargé. Initialisation de Python...",
                    progress: 55
                });


                pyodide =
                    await loadPyodide({
                        indexURL: BASE
                    });


                pyodide.setStdout({

                    batched(text) {

                        send("stdout", {
                            text
                        });

                    }

                });


                pyodide.setStderr({

                    batched(text) {

                        send("stderr", {
                            text
                        });

                    }

                });


                send("loading", {
                    text: "Python est prêt !",
                    progress: 100
                });


                send("ready");

            } catch(error) {

                send("fatal", {
                    error:
                        "Erreur pendant l'initialisation de Python :\\\\n\\\\n" +
                        String(error)
                });

            }

        }


        async function runPython(source, id) {

            if (!pyodide) {

                send("error", {
                    id,
                    error:
                        "Python n'est pas encore prêt."
                });

                return;
            }


            try {

                /*
                    Vérification syntaxique
                */

                await pyodide.runPythonAsync(

                    "compile(" +
                    JSON.stringify(source) +
                    ", '<editor>', 'exec')"

                );


                send("syntax-ok", {
                    id
                });


                /*
                    Exécution
                */

                await pyodide.runPythonAsync(
                    source
                );


                send("done", {
                    id
                });

            } catch(error) {

                send("error", {
                    id,
                    error:
                        String(error)
                });

            }

        }


        self.onmessage = function(event) {

            const data =
                event.data;


            if (
                data.type === "run"
            ) {

                runPython(
                    data.code,
                    data.id
                );

            }

        };


        start();

    `;


    const blob =
        new Blob(
            [workerCode],
            {
                type:
                    "application/javascript"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const newWorker =
        new Worker(url);


    URL.revokeObjectURL(url);


    return newWorker;
}


/* =====================================================
   INITIALISATION WORKER
===================================================== */

function initializeWorker() {

    if (worker) {

        try {
            worker.terminate();
        } catch {}
    }


    worker =
        null;

    workerReady =
        false;


    runButton.disabled =
        true;


    stopButton.disabled =
        true;


    loadingOverlay.style.display =
        "flex";


    loadingError.style.display =
        "none";


    loadingButtons.style.display =
        "none";


    loadingText.textContent =
        "Création du Web Worker...";


    progressBar.style.width =
        "5%";


    statusElement.textContent =
        "🟡 Chargement de Python...";


    try {

        worker =
            createWorker();

    } catch(error) {

        showLoadingError(
            "Impossible de créer le Web Worker :\n\n" +
            String(error)
        );

        return;
    }


    worker.onmessage =
        handleWorkerMessage;


    worker.onerror =
        function(error) {

            showLoadingError(
                "Le Web Worker a rencontré une erreur :\n\n" +
                (
                    error.message ||
                    String(error)
                )
            );

        };
}


/* =====================================================
   MESSAGES WORKER
===================================================== */

function handleWorkerMessage(event) {

    const data =
        event.data;


    if (
        data.type === "loading"
    ) {

        loadingText.textContent =
            data.text;


        progressBar.style.width =
            data.progress + "%";


        return;
    }


    if (
        data.type === "ready"
    ) {

        workerReady =
            true;


        loadingText.textContent =
            "Python est prêt !";


        progressBar.style.width =
            "100%";


        statusElement.textContent =
            "🟢 Python prêt";


        runButton.disabled =
            false;


        loadingOverlay.style.display =
            "none";


        consoleWrite(
            "✓ Python chargé avec succès.\n",
            "console-success"
        );


        return;
    }


    if (
        data.type === "fatal"
    ) {

        showLoadingError(
            data.error
        );

        return;
    }


    if (
        data.type === "stdout"
    ) {

        consoleWrite(
            data.text
        );

        return;
    }


    if (
        data.type === "stderr"
    ) {

        consoleWrite(
            data.text,
            "console-error"
        );

        return;
    }


    if (
        data.type === "syntax-ok"
    ) {

        hideError();

        return;
    }


    if (
        data.type === "done"
    ) {

        finishRun(true);

        return;
    }


    if (
        data.type === "error"
    ) {

        showPythonError(
            data.error
        );

        finishRun(false);

        return;
    }
}


/* =====================================================
   ERREUR CHARGEMENT
===================================================== */

function showLoadingError(message) {

    workerReady =
        false;


    loadingOverlay.style.display =
        "flex";


    loadingText.textContent =
        "❌ Impossible de charger Python";


    progressBar.style.width =
        "0%";


    loadingError.textContent =
        message;


    loadingError.style.display =
        "block";


    loadingButtons.style.display =
        "flex";


    statusElement.textContent =
        "🔴 Python indisponible";


    runButton.disabled =
        true;


    stopButton.disabled =
        true;
}


function restartPython() {

    clearTimeout(runTimer);

    runTimer =
        null;


    running =
        false;


    runId++;


    initializeWorker();
}


/* =====================================================
   EXECUTION
===================================================== */

function runCode() {

    if (
        !worker ||
        !workerReady
    ) {

        consoleWrite(
            "❌ Python n'est pas prêt.\n",
            "console-error"
        );

        return;
    }


    if (running) {
        return;
    }


    const source =
        code.value;


    if (!source.trim()) {

        consoleWrite(
            "⚠️ Le fichier est vide.\n",
            "console-error"
        );

        return;
    }


    saveLocal();


    running =
        true;


    runId++;


    const id =
        runId;


    runButton.disabled =
        true;


    stopButton.disabled =
        false;


    statusElement.textContent =
        "🟡 Exécution...";


    hideError();

    clearConsole();


    consoleWrite(
        "▶ Exécution de " +
        currentFile +
        "...\n",
        "console-info"
    );


    /*
       Timeout de sécurité :
       30 secondes.
    */

    runTimer =
        setTimeout(
            function() {

                if (
                    running &&
                    id === runId
                ) {

                    consoleWrite(
                        "\n⏱️ Temps limite atteint : 30 secondes.\n",
                        "console-error"
                    );


                    stopCode();
                }

            },
            30000
        );


    worker.postMessage({

        type:
            "run",

        code:
            source,

        id:
            id

    });
}


/* =====================================================
   VRAI ARRÊT
===================================================== */

function stopCode() {

    if (!running) {
        return;
    }


    runId++;


    if (worker) {

        worker.terminate();

        worker =
            null;
    }


    running =
        false;


    workerReady =
        false;


    clearTimeout(
        runTimer
    );


    runTimer =
        null;


    runButton.disabled =
        true;


    stopButton.disabled =
        true;


    statusElement.textContent =
        "🟠 Programme arrêté";


    consoleWrite(
        "\n⏹ Programme arrêté.\n",
        "console-error"
    );


    /*
       On recrée Python.
    */

    setTimeout(
        function() {

            initializeWorker();

        },
        100
    );
}


/* =====================================================
   FIN
===================================================== */

function finishRun(success) {

    if (!running) {
        return;
    }


    running =
        false;


    clearTimeout(
        runTimer
    );


    runTimer =
        null;


    runButton.disabled =
        false;


    stopButton.disabled =
        true;


    statusElement.textContent =
        "🟢 Python prêt";


    if (success) {

        consoleWrite(
            "\n✓ Programme terminé.\n",
            "console-success"
        );
    }
}


/* =====================================================
   ERREURS PYTHON
===================================================== */

function showPythonError(message) {

    const match =
        message.match(
            /line\\s+(\\d+)/i
        );


    const line =
        match
            ? match[1]
            : "?";


    showError(
        "❌ Ligne " +
        line +
        " : " +
        message
    );


    consoleWrite(
        "\n❌ " +
        message +
        "\n",
        "console-error"
    );
}


function showError(message) {

    errorPanel.textContent =
        message;


    errorPanel.style.display =
        "block";
}


function hideError() {

    errorPanel.style.display =
        "none";
}


/* =====================================================
   LIGNES
===================================================== */

function updateLineNumbers() {

    const count =
        code.value.split("\n").length;


    let html = "";


    for (
        let i = 1;
        i <= count;
        i++
    ) {

        html +=
            i +
            "<br>";
    }


    lineNumbers.innerHTML =
        html;
}


/* =====================================================
   COLORATION
===================================================== */

function escapeHtml(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}


function updateHighlight() {

    let text =
        code.value;


    if (!text) {

        highlight.innerHTML =
            "";

        return;
    }


    let escaped =
        escapeHtml(text);


    const tokens = [];


    escaped =
        escaped.replace(
            /(#.*|"[^"\n]*"|'[^'\n]*')/g,
            function(match) {

                const id =
                    tokens.length;


                tokens.push(match);


                return (
                    "___TOKEN_" +
                    id +
                    "___"
                );
            }
        );


    escaped =
        escaped.replace(
            /\b(and|as|assert|async|await|break|case|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|match|nonlocal|not|or|pass|raise|return|try|while|with|yield)\b/g,
            '<span class="syntax-keyword">$1</span>'
        );


    escaped =
        escaped.replace(
            /\b(print|input|len|range|str|int|float|bool|list|dict|set|tuple|open|sum|min|max|abs|round|enumerate|zip|map|filter|sorted|type|isinstance|super|property)\b/g,
            '<span class="syntax-builtin">$1</span>'
        );


    escaped =
        escaped.replace(
            /\b(True|False|None)\b/g,
            '<span class="syntax-boolean">$1</span>'
        );


    escaped =
        escaped.replace(
            /\b\d+(?:\.\d+)?\b/g,
            '<span class="syntax-number">$&</span>'
        );


    escaped =
        escaped.replace(
            /___TOKEN_(\d+)___/g,
            function(_, id) {

                const token =
                    tokens[
                        Number(id)
                    ];


                if (
                    token.startsWith("#")
                ) {

                    return (
                        '<span class="syntax-comment">' +
                        token +
                        "</span>"
                    );
                }


                return (
                    '<span class="syntax-string">' +
                    token +
                    "</span>"
                );
            }
        );


    highlight.innerHTML =
        escaped +
        "\n";
}


/* =====================================================
   SCROLL
===================================================== */

function syncScroll() {

    highlight.scrollTop =
        code.scrollTop;


    highlight.scrollLeft =
        code.scrollLeft;


    lineNumbers.scrollTop =
        code.scrollTop;
}


code.addEventListener(
    "scroll",
    syncScroll
);


/* =====================================================
   SAUVEGARDE
===================================================== */

function getFiles() {

    try {

        const saved =
            localStorage.getItem(
                FILES_KEY
            );


        if (!saved) {
            return ["main.py"];
        }


        const files =
            JSON.parse(saved);


        if (
            Array.isArray(files) &&
            files.length
        ) {

            return files;
        }

    } catch {}


    return ["main.py"];
}


function saveFilesList(files) {

    localStorage.setItem(
        FILES_KEY,
        JSON.stringify(files)
    );
}


function saveLocal() {

    try {

        localStorage.setItem(
            "python_ide_v71_" +
            currentFile,
            code.value
        );

    } catch {}
}


function loadLocal(filename) {

    try {

        return localStorage.getItem(
            "python_ide_v71_" +
            filename
        );

    } catch {

        return null;
    }
}


function saveFile() {

    saveLocal();


    const files =
        getFiles();


    if (
        !files.includes(
            currentFile
        )
    ) {

        files.push(
            currentFile
        );

        saveFilesList(files);
    }


    loadFilesList();


    consoleWrite(
        "✓ " +
        currentFile +
        " sauvegardé.\n",
        "console-success"
    );
}


/* =====================================================
   NOUVEAU FICHIER
===================================================== */

function newFile() {

    let filename =
        prompt(
            "Nom du nouveau fichier :",
            "nouveau.py"
        );


    if (!filename) {
        return;
    }


    filename =
        filename.trim();


    filename =
        filename.replace(
            /[\\/:*?"<>|]/g,
            "_"
        );


    if (
        !filename
            .toLowerCase()
            .endsWith(".py")
    ) {

        filename += ".py";
    }


    const files =
        getFiles();


    if (
        files.includes(filename)
    ) {

        alert(
            "⚠️ Ce fichier existe déjà."
        );

        return;
    }


    files.push(filename);

    saveFilesList(files);


    localStorage.setItem(
        "python_ide_v71_" +
        filename,

`# ${filename}

print("Hello Python !")
`
    );


    loadFilesList();


    selectFile(
        filename,
        document.querySelector(
            '[data-file="' +
            CSS.escape(filename) +
            '"]'
        )
    );
}


/* =====================================================
   SUPPRIMER
===================================================== */

function deleteCurrentFile() {

    if (
        currentFile ===
        "main.py"
    ) {

        alert(
            "⚠️ main.py ne peut pas être supprimé."
        );

        return;
    }


    if (
        !confirm(
            "🗑️ Supprimer « " +
            currentFile +
            " » ?"
        )
    ) {

        return;
    }


    localStorage.removeItem(
        "python_ide_v71_" +
        currentFile
    );


    let files =
        getFiles();


    files =
        files.filter(
            file =>
                file !==
                currentFile
        );


    saveFilesList(files);


    currentFile =
        "main.py";


    loadFilesList();


    selectFile(
        "main.py",
        document.querySelector(
            '[data-file="main.py"]'
        )
    );


    consoleWrite(
        "🗑️ Fichier supprimé.\n",
        "console-success"
    );
}


/* =====================================================
   LISTE FICHIERS
===================================================== */

function loadFilesList() {

    const fileList =
        document.getElementById(
            "fileList"
        );


    fileList.innerHTML =
        "";


    let files =
        getFiles();


    if (
        !files.includes("main.py")
    ) {

        files.unshift("main.py");
    }


    saveFilesList(files);


    files.forEach(
        function(filename) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "file";


            if (
                filename ===
                currentFile
            ) {

                div.classList.add(
                    "active"
                );
            }


            div.dataset.file =
                filename;


            div.textContent =
                "🐍 " +
                filename;


            div.onclick =
                function() {

                    selectFile(
                        filename,
                        div
                    );

                };


            fileList.appendChild(div);

        }
    );
}


/* =====================================================
   CHANGER FICHIER
===================================================== */

function selectFile(
    filename,
    element
) {

    saveLocal();


    currentFile =
        filename;


    document
        .querySelectorAll(".file")
        .forEach(
            file =>
                file.classList.remove(
                    "active"
                )
        );


    if (element) {

        element.classList.add(
            "active"
        );
    }


    const saved =
        loadLocal(filename);


    if (
        saved !== null
    ) {

        code.value =
            saved;

    } else if (
        filename ===
        "main.py"
    ) {

        code.value =
`print("Bonjour !")

nom = input("Quel est ton nom ? ")

print("Bonjour", nom)
`;

        saveLocal();

    } else {

        code.value =
`# ${filename}

print("Hello Python !")
`;

        saveLocal();
    }


    updateLineNumbers();

    updateHighlight();

    hideError();
}


/* =====================================================
   AUTOCOMPLETION
===================================================== */

const suggestions = [

    "print",
    "input",
    "len",
    "range",
    "str",
    "int",
    "float",
    "bool",
    "list",
    "dict",
    "set",
    "tuple",
    "open",
    "sum",
    "min",
    "max",
    "abs",
    "round",
    "enumerate",
    "zip",
    "map",
    "filter",
    "sorted",
    "type",
    "isinstance",

    "import",
    "from",
    "as",

    "def",
    "class",

    "if",
    "elif",
    "else",

    "for",
    "while",
    "in",

    "return",

    "try",
    "except",
    "finally",

    "with",

    "pass",
    "break",
    "continue",

    "raise",
    "yield",

    "lambda",

    "async",
    "await",

    "True",
    "False",
    "None"
];


function getCurrentWord() {

    const cursor =
        code.selectionStart;


    const before =
        code.value.substring(
            0,
            cursor
        );


    const match =
        before.match(
            /[A-Za-z_][A-Za-z0-9_]*$/
        );


    return match
        ? match[0]
        : "";
}


function hideAutocomplete() {

    autocomplete.style.display =
        "none";
}


function showAutocomplete() {

    const word =
        getCurrentWord();


    if (!word) {

        hideAutocomplete();

        return;
    }


    const results =
        suggestions
            .filter(
                item =>
                    item
                        .toLowerCase()
                        .startsWith(
                            word.toLowerCase()
                        )
            )
            .slice(0, 10);


    if (!results.length) {

        hideAutocomplete();

        return;
    }


    autocomplete.innerHTML =
        "";


    results.forEach(
        function(item, index) {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "suggestion";


            if (index === 0) {

                div.classList.add(
                    "selected"
                );
            }


            div.innerHTML =
                escapeHtml(item) +
                '<span class="suggestion-type">Python</span>';


            div.addEventListener(
                "mousedown",
                function(event) {

                    event.preventDefault();

                    insertSuggestion(item);

                }
            );


            autocomplete.appendChild(div);

        }
    );


    const before =
        code.value.substring(
            0,
            code.selectionStart
        );


    const lines =
        before.split("\n");


    const line =
        lines.length - 1;


    const column =
        lines[line].length;


    autocomplete.style.left =
        (
            18 +
            column * 8.4
        ) + "px";


    autocomplete.style.top =
        (
            15 +
            (line + 1) * 22
        ) + "px";


    autocomplete.style.display =
        "block";
}


function insertSuggestion(word) {

    const cursor =
        code.selectionStart;


    const before =
        code.value.substring(
            0,
            cursor
        );


    const match =
        before.match(
            /[A-Za-z_][A-Za-z0-9_]*$/
        );


    if (!match) {
        return;
    }


    const start =
        cursor -
        match[0].length;


    code.value =
        code.value.substring(
            0,
            start
        ) +
        word +
        code.value.substring(
            cursor
        );


    code.selectionStart =
        code.selectionEnd =
            start + word.length;


    hideAutocomplete();

    onCodeInput();

    code.focus();
}


/* =====================================================
   EDITION
===================================================== */

function onCodeInput() {

    updateLineNumbers();

    updateHighlight();

    saveLocal();

    hideError();
}


code.addEventListener(
    "input",
    onCodeInput
);


code.addEventListener(
    "keyup",
    function(event) {

        if (
            event.key.length === 1 ||
            event.key === "Backspace" ||
            event.key === "Delete"
        ) {

            showAutocomplete();
        }
    }
);


code.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Tab"
        ) {

            event.preventDefault();


            const start =
                code.selectionStart;


            const end =
                code.selectionEnd;


            code.value =
                code.value.substring(
                    0,
                    start
                ) +
                "    " +
                code.value.substring(
                    end
                );


            code.selectionStart =
                code.selectionEnd =
                    start + 4;


            onCodeInput();


            return;
        }


        if (
            event.key === "Enter"
        ) {

            hideAutocomplete();


            const start =
                code.selectionStart;


            const before =
                code.value.substring(
                    0,
                    start
                );


            const line =
                before
                    .split("\n")
                    .pop();


            const indent =
                (
                    line.match(
                        /^\s*/
                    ) || [""]
                )[0];


            const extra =
                line
                    .trim()
                    .endsWith(":")
                    ? "    "
                    : "";


            event.preventDefault();


            const insertion =
                "\n" +
                indent +
                extra;


            code.value =
                code.value.substring(
                    0,
                    start
                ) +
                insertion +
                code.value.substring(
                    code.selectionEnd
                );


            code.selectionStart =
                code.selectionEnd =
                    start +
                    insertion.length;


            onCodeInput();
        }


        if (
            event.key === "Escape"
        ) {

            hideAutocomplete();
        }
    }
);
